services:
  postgres:
    image: postgres:16-alpine
    container_name: practics-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: arosv754
      POSTGRES_DB: practics
    ports:
      - "9300:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - practics

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: practics-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/practics
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: arosv754
      KC_DB_SCHEMA: keycloak
    ports:
      - "9200:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      - postgres
    networks:
      - practics

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: practics-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: arosv754
      DB_NAME: practics
    ports:
      - "9100:3000"
    depends_on:
      - postgres
    networks:
      - practics

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: http://localhost:9200
        VITE_KEYCLOAK_REALM: practics
        VITE_KEYCLOAK_CLIENT_ID: frontend
        VITE_API_URL: http://localhost:9100
    container_name: practics-frontend
    ports:
      - "9000:80"
    depends_on:
      - backend
      - keycloak
    networks:
      - practics

networks:
  practics:
    driver: bridge